<app-navbar></app-navbar>
<div class="row " style="padding-top: 3%; padding-bottom:3%;background-image: linear-gradient( rgba(0, 0, 0, 0.300) ,  rgba(0, 0, 0, 0.300)), url(../../assets/files/sakura_flowers_petals_206544_1600x1200.jpg);
background-position: center;
   background-size: 1550px;
   height:700px;
  background-repeat: no-repeat;">

  <div class="col-sm-4"></div>
  <div class="col-sm-4">
    <br><br><br><br>
    <div class="card bg-transparent">
      <div class="card-body shadow-lg" style="background-color: #afd6d6a1;">
        <form #loginForm="ngForm">
          <h1 class="text-dark text-center"><u>{{'Forgot Password' | translate}}</u></h1>
          <div *ngIf="form.error" class="alert alert-danger alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{form.message | translate}}
          </div>
          <div *ngIf="form.error == false && form.message == 'Password has been sent to email id'"
            class="alert alert-success alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{form.message | translate }}
          </div>
          <div style="padding-top:3%">
            <span class="pt-2"><b>{{'Email Id' | translate}}</b>
              <span class="required-field"></span></span>

            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-envelope grey-text"></i> </div>
                </div>
                <input type="text" name="loginId" [(ngModel)]="form.login" class="form-control"
                  placeholder="{{'Enter Login Id' | translate}}">
              </div>
            </div>
          </div>

          <span class="alertRedColor">{{inputerror.loginId | translate }}</span>

          <div class="row pt-3 pl-3 pb-3">
            <div class="pt-2">
              <button (click)="submit()" [disabled]="!validate()" class="btn btn-success mr-2">
                {{'Send My Password' | translate}}</button>
            </div>
          </div>
        </form>
      </div>
      <br><br><br><br><br><br><br><br>
    </div>

  </div>
  
</div>
<app-footer></app-footer>
